name: Testes

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar fluxos e validação de mídia
        run: |
          node tests/frontend.test.mjs
          node tests/same-origin.test.mjs

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: plataforma_estudos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plataforma_estudos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/plataforma_estudos_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: ci-only-disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar e testar o Spring Boot
        run: sh mvnw --batch-mode --no-transfer-progress verify

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir e validar a imagem com PostgreSQL descartável
        run: node tests/docker-smoke.mjs
