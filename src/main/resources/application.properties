spring.application.name=plataforma-estudos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/plataforma_estudos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${PORT:8085}
jwt.secret=${JWT_SECRET}

logging.level.org.springframework.security=INFO
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
app.catalog.initialize=${INIT_CATALOG:false}
app.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
server.servlet.session.timeout=5m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
